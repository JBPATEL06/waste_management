ndary-fixed-dim": "#b9c7df", "on-error": "#ffffff", "primary-fixed": "#95f8a7", "tertiary-fixed-dim": "#ffb2bd", "on-secondary": "#ffffff", "text": "#0F172A", "border": "#E2E8F0", "surface": "#FFFFFF", "primary": "#00652c", "primary-soft": "#DCFCE7", "on-surface": "#131b2e", "badge-created-bg": "#F1F5F9", "on-primary-container": "#d3ffd5", "surface-container": "#eaedff", "badge-rts-bg": "#EDE9FE", "outline-variant": "#becabc", "on-secondary-fixed-variant": "#3a485b", "text-muted": "#475569", "surface-variant": "#dae2fd", "badge-superseded-text": "#64748B", "surface-container-lowest": "#ffffff", "error-container": "#ffdad6" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-md": "0.75rem", "margin-mobile": "1rem", "space-2xl": "2rem", "space-xs": "0.25rem", "space-sm": "0.5rem", "space-xl": "1.5rem", "gutter": "1rem", "space-lg": "1rem", "gutter-mobile": "0.75rem", "margin": "1.5rem" }, "fontFamily": { "section-title": [ "Inter" ], "body-medium": [ "Inter" ], "label": [ "Inter" ], "badge": [ "Inter" ], "kpi-number": [ "Inter" ], "caption": [ "Inter" ], "batch-id": [ "Inter" ], "body": [ "Inter" ], "page-title": [ "Inter" ] }, "fontSize": { "section-title": [ "18px", { "lineHeight": "24px", "fontWeight": "600" } ], "body-medium": [ "14px", { "lineHeight": "20px", "fontWeight": "500" } ], "label": [ "13px", { "lineHeight": "18px", "fontWeight": "500" } ], "badge": [ "12px", { "lineHeight": "16px", "fontWeight": "500" } ], "kpi-number": [ "24px", { "lineHeight": "32px", "fontWeight": "600" } ], "caption": [ "12px", { "lineHeight": "16px", "fontWeight": "400" } ], "batch-id": [ "14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600" } ], "body": [ "14px", { "lineHeight": "20px", "fontWeight": "400" } ], "page-title": [ "24px", { "lineHeight": "32px", "fontWeight": "600" } ] } } } };</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/></head><body class="bg-background font-body text-text min-h-screen flex items-center justify-center p-gutter-mobile sm:p-gutter"><main class="w-full max-w-[400px] flex flex-col items-center"><div class="flex flex-col w-full">
<div class="flex flex-col items-center mb-6">
<div class="flex items-center gap-3">
<img alt="Waste Journey Tracker Logo" class="w-8 h-8 rounded-md" height="32" src="https://lh3.googleusercontent.com/aida/AEtjO1WBv67N4nHpZc9L2YxyBpbQEdQVaFbnBYt_l-1DczmKUFgRLSEaRktSL8LRf3G6vIi-bSwYBeD8P0niYurrsJ-ou0wCTzAtz4czA5zzbo8CNjDzjNBwRu7yltWOK4K0V7Hu1xZCHlsMyQ7hTP7Ckp8w4-fgnHOGv0S1LjAj5mbWIakZsm714kBMf-i_u7slNegYgI8FhrnbE0L4HnPUUw2eJxBQHPlN3UIrK6KI5HSbxNISUivOlSVCpY0" width="32"/>
<span class="font-section-title text-section-title text-text tracking-tight">Waste Journey Tracker</span>
</div>
</div>
<div class="w-full bg-surface border border-border rounded-xl p-5 shadow-sm">
<div class="mb-5">
<h1 class="font-page-title text-page-title text-text">Change Password</h1>
<p class="font-label text-label text-text-muted mt-1">Please choose a new password to secure your account.</p>
</div>
<form class="flex flex-col gap-4" id="changePasswordForm" onsubmit="event.preventDefault(); handlePasswordSubmit();">
<div class="flex flex-col gap-1.5">
<label class="font-label text-label text-text-muted" for="currentPassword">Current password</label>
<div class="relative w-full">
<input autocomplete="current-password" class="w-full h-10 px-3 pr-10 bg-surface border border-border rounded-lg font-body text-body text-text focus:outline-none focus:ring-2 focus:ring-primary-container transition-all" id="currentPassword" name="currentPassword" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle current password visibility" class="absolute right-0 top-0 h-10 w-10 flex items-center justify-center text-text-muted hover:text-text focus:outline-none" onclick="toggleVisibility('currentPassword', 'eyeCurrent')" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeCurrent">visibility</span>
</button>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label text-label text-text-muted" for="newPassword">New password</label>
<div class="relative w-full">
<input autocomplete="new-password" class="w-full h-10 px-3 pr-10 bg-surface border border-border rounded-lg font-body text-body text-text focus:outline-none focus:ring-2 focus:ring-primary-container transition-all" id="newPassword" name="newPassword" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle new password visibility" class="absolute right-0 top-0 h-10 w-10 flex items-center justify-center text-text-muted hover:text-text focus:outline-none" onclick="toggleVisibility('newPassword', 'eyeNew')" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeNew">visibility</span>
</button>
</div>
<p class="font-caption text-caption text-text-muted mt-0.5 leading-tight">
          Minimum 8 characters, at least one letter and one number. Cannot match current password.
        </p>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label text-label text-text-muted" for="confirmPassword">Confirm new password</label>
<div class="relative w-full">
<input autocomplete="new-password" class="w-full h-10 px-3 pr-10 bg-surface border border-border rounded-lg font-body text-body text-text focus:outline-none focus:ring-2 focus:ring-primary-container transition-all" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle confirm password visibility" class="absolute right-0 top-0 h-10 w-10 flex items-center justify-center text-text-muted hover:text-text focus:outline-none" onclick="toggleVisibility('confirmPassword', 'eyeConfirm')" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeConfirm">visibility</span>
</button>
</div>
</div>
<div class="hidden mt-1 p-2.5 rounded-lg text-caption font-caption" id="formFeedback" role="alert"></div>
<div class="pt-2">
<button class="w-full h-10 bg-primary-container hover:bg-primary-hover text-on-primary font-body-medium text-body-medium rounded-lg flex items-center justify-center transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2" id="submitButton" type="submit">
          Update Password
        </button>
</div>
</form>
</div>
</div>
<script>
  function toggleVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input || !icon) return;

    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function handlePasswordSubmit() {
    const current = document.getElementById('currentPassword').value;
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;
    const feedback = document.getElementById('formFeedback');
    const submitBtn = document.getElementById('submitButton');

    feedback.className = 'hidden mt-1 p-2.5 rounded-lg text-caption font-caption';
    feedback.textContent = '';

    if (newPass.length < 8 || !/[A-Za-z]/.test(newPass) || !/[0-9]/.test(newPass)) {
      feedback.className = 'mt-1 p-2.5 rounded-lg text-caption font-caption bg-error-soft text-error border border-error/20';
      feedback.textContent = 'New password does not meet the complexity requirements.';
      return;
    }

    if (newPass === current) {
      feedback.className = 'mt-1 p-2.5 rounded-lg text-caption font-caption bg-warning-soft text-warning border border-warning/20';
      feedback.textContent = 'New password cannot match your current password.';
      return;
    }

    if (newPass !== confirmPass) {
      feedback.className = 'mt-1 p-2.5 rounded-lg text-caption font-caption bg-error-soft text-error border border-error/20';
      feedback.textContent = 'New password and confirmation do not match.';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating...';

    setTimeout(() => {
      feedback.className = 'mt-1 p-2.5 rounded-lg text-caption font-caption bg-badge-completed-bg text-badge-completed-text border border-badge-completed-text/20';
      feedback.textContent = 'Password updated successfully. Redirecting...';
      submitBtn.textContent = 'Updated';
    }, 600);
  }
</script></main></body></html>
