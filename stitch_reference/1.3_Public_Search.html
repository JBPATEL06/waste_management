<div class="flex items-center gap-space-sm mb-space-xl">
<img alt="Waste Journey Tracker Logo" class="w-8 h-8 rounded-lg object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1WBv67N4nHpZc9L2YxyBpbQEdQVaFbnBYt_l-1DczmKUFgRLSEaRktSL8LRf3G6vIi-bSwYBeD8P0niYurrsJ-ou0wCTzAtz4czA5zzbo8CNjDzjNBwRu7yltWOK4K0V7Hu1xZCHlsMyQ7hTP7Ckp8w4-fgnHOGv0S1LjAj5mbWIakZsm714kBMf-i_u7slNegYgI8FhrnbE0L4HnPUUw2eJxBQHPlN3UIrK6KI5HSbxNISUivOlSVCpY0"/>
<span class="font-section-title text-section-title text-text tracking-tight">Waste Journey Tracker</span>
</div>
<div class="w-full bg-surface rounded-xl border border-border p-[20px] shadow-sm flex flex-col">
<h1 class="font-page-title text-page-title text-text">Track Waste Batch</h1>
<p class="font-label text-label text-text-muted mt-space-xs leading-normal">
      Enter a batch code to view its real-time journey and processing timeline.
    </p>
<form class="mt-space-xl flex flex-col" id="track-form" onsubmit="event.preventDefault(); handleSearch();">
<div class="flex flex-col gap-space-xs">
<label class="font-label text-label text-text-muted" for="batchId">
          Batch ID
        </label>
<div class="relative w-full">
<input autocomplete="off" class="w-full h-[40px] px-space-md bg-surface text-text font-batch-id text-batch-id placeholder:text-text-disabled placeholder:font-body rounded-lg border border-border focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all uppercase" id="batchId" name="batchId" placeholder="e.g. WB-2026-0001" spellcheck="false" type="text"/>
</div>
</div>
<button class="mt-space-lg w-full h-[40px] bg-primary text-on-primary font-body-medium text-body-medium rounded-lg hover:bg-primary-hover active:bg-primary-hover focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-colors flex items-center justify-center gap-space-xs cursor-pointer" id="submit-btn" type="submit">
<span class="material-symbols-outlined text-[18px]">search</span>
<span>Search Batch</span>
</button>
<div class="hidden mt-space-md p-space-sm rounded-lg bg-error-soft text-error flex items-start gap-space-xs" id="error-state" role="alert">
<span class="material-symbols-outlined text-[18px] shrink-0 mt-[1px]">error</span>
<span class="font-caption text-caption font-medium">Batch ID not found. Please verify the code and try again.</span>
</div>
</form>
</div>
</div>
<script>
  function handleSearch() {
    const input = document.getElementById('batchId');
    const errorBox = document.getElementById('error-state');
    const val = input.value.trim().toUpperCase();

    if (!val || val === 'WB-0000-0000' || val.length < 5) {
      errorBox.classList.remove('hidden');
      input.classList.add('border-error');
      input.classList.remove('border-border');
    } else {
      errorBox.classList.add('hidden');
      input.classList.remove('border-error');
      input.classList.add('border-border');
      window.location.href = '/track/' + encodeURIComponent(val);
    }
  }

  document.getElementById('batchId').addEventListener('input', function() {
    const errorBox = document.getElementById('error-state');
    if (!errorBox.classList.contains('hidden')) {
      errorBox.classList.add('hidden');
      this.classList.remove('border-error');
      this.classList.add('border-border');
    }
  });
</script></main></body></html>
