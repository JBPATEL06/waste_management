<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/></head><body class="bg-background font-body text-text min-h-screen flex items-center justify-center p-gutter-mobile sm:p-gutter"><main class="w-full max-w-[400px] flex flex-col items-center"><div class="flex flex-col w-full">
<div class="flex items-center justify-center gap-space-sm mb-space-xl">
<img alt="Waste Journey Tracker Logo" class="w-8 h-8 rounded-md shrink-0" src="https://lh3.googleusercontent.com/aida/AEtjO1WBv67N4nHpZc9L2YxyBpbQEdQVaFbnBYt_l-1DczmKUFgRLSEaRktSL8LRf3G6vIi-bSwYBeD8P0niYurrsJ-ou0wCTzAtz4czA5zzbo8CNjDzjNBwRu7yltWOK4K0V7Hu1xZCHlsMyQ7hTP7Ckp8w4-fgnHOGv0S1LjAj5mbWIakZsm714kBMf-i_u7slNegYgI8FhrnbE0L4HnPUUw2eJxBQHPlN3UIrK6KI5HSbxNISUivOlSVCpY0"/>
<span class="font-page-title text-page-title text-text tracking-tight">Waste Journey Tracker</span>
</div>
<div class="w-full bg-surface rounded-xl p-[20px] shadow-sm">
<h1 class="font-page-title text-page-title text-text mb-space-xl">Sign in</h1>
<div class="hidden mb-space-lg p-space-md bg-error-soft rounded-lg flex items-start gap-space-sm" id="login-alert">
<span class="material-symbols-outlined text-error text-[18px] leading-none shrink-0 mt-0.5">error</span>
<p class="font-caption text-caption text-error font-medium leading-tight" id="login-alert-text">Invalid email or password. Please verify your credentials.</p>
</div>
<form class="space-y-space-lg" id="login-form" onsubmit="event.preventDefault(); handleLogin();">
<div class="space-y-space-xs">
<label class="block font-label text-label text-text-muted" for="email">Email address</label>
<input autocomplete="email" class="w-full h-[40px] px-space-md bg-surface text-text font-body text-body rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-container placeholder:text-text-disabled transition-colors" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<div class="space-y-space-xs">
<label class="block font-label text-label text-text-muted" for="password">Password</label>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-[40px] pl-space-md pr-10 bg-surface text-text font-body text-body rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-container placeholder:text-text-disabled transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-0 top-0 h-[40px] w-10 flex items-center justify-center text-text-muted hover:text-text focus:outline-none" id="toggle-password" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwd-icon">visibility</span>
</button>
</div>
</div>
<button class="w-full h-[40px] bg-primary-container hover:bg-primary-hover text-on-primary font-body-medium text-body-medium rounded-lg flex items-center justify-center transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2" id="submit-btn" type="submit">
        Login
      </button>
</form>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const pwdIcon = document.getElementById('pwd-icon');
    if (!passwordInput || !pwdIcon) return;
    
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      pwdIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      pwdIcon.textContent = 'visibility';
    }
  }

  function handleLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const alertBox = document.getElementById('login-alert');
    const alertText = document.getElementById('login-alert-text');
    const submitBtn = document.getElementById('submit-btn');

    if (!email || !password) {
      alertText.textContent = 'Please fill in both fields.';
      alertBox.classList.remove('hidden');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.classList.add('opacity-75');

    setTimeout(() => {
      submitBtn.disabled = false;
      submitBtn.classList.remove('opacity-75');

      if (email.includes('locked')) {
        alertText.textContent = 'Account locked due to consecutive failed attempts. Contact an administrator.';
        alertBox.classList.remove('hidden');
      } else if (password !== 'operator123') {
        alertText.textContent = 'Invalid credentials. Please verify your email and password.';
        alertBox.classList.remove('hidden');
      } else {
        alertBox.classList.add('hidden');
      }
    }, 400);
  }
</script></main></body></html>
